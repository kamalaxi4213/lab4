    <div class="card">

            <img src="./kyojuro-rengoku-fire-anime-style-wallpaper-157.jpg" alt="Demon Slayer Team">

            <p>I still have things I need to do.</p>
            <p>I can’t afford to die yet. </p>
            <p>We’re all connected.</p>
            <p>Never give up </p>
            <p> look straight ahead.</p>

    </div>
